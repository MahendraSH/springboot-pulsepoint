<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadcn/ui Component Library — PulsePoint Spring Boot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <!-- PulsePoint v2 Runtime -->
    <script type="module">
        import { ComponentInit as PP } from "/js/pp-reactive-v2.min.js";
        PP.bootstrap();
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        <!-- Showcase Header -->
        <header class="mb-10 pb-6 border-b border-zinc-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">shadcn/ui Component Library</h1>
                        <p class="text-sm text-zinc-400 mt-1">Public reusable UI component showcase powered by Spring Boot Thymeleaf & PulsePoint v2</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="/tasks" class="px-4 py-2 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-zinc-300 rounded-lg text-sm font-medium transition-all">← Back to App</a>
                <a href="/login" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium shadow-sm transition-all">Sign In</a>
            </div>
        </header>

        <!-- Reactive Component Showcase Boundary -->
        <template pp-component="components_showcase">
            <div pp-component="components_showcase" class="space-y-12">

                <!-- 1. Buttons & Action Components -->
                <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 sm:p-8 space-y-6">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Buttons & Badges
                    </h2>
                    <div class="flex flex-wrap items-center gap-4">
                        <div th:replace="~{components/ui/button :: primary(text='Primary Button', loadingText='Loading...', isSubmittingExpr='isSubmitting', iconPath='M12 4v16m8-8H4')}"></div>
                        <div th:replace="~{components/ui/button :: action(label='Action Secondary', clickExpr='toggleSwitch()', variantClass='bg-zinc-800 text-zinc-200 border border-zinc-700 hover:bg-zinc-700')}"></div>
                        <div th:replace="~{components/ui/button :: action(label='Destructive Action', clickExpr='showAlert()', variantClass='bg-rose-500/10 text-rose-300 border border-rose-500/20 hover:bg-rose-500/20')}"></div>
                    </div>
                    <div class="flex items-center gap-3 pt-2">
                        <span class="text-xs text-zinc-400 font-medium">Badges:</span>
                        <div th:replace="~{components/ui/badge :: status-badges(statusField='\'TODO\'')}"></div>
                        <div th:replace="~{components/ui/badge :: status-badges(statusField='\'IN_PROGRESS\'')}"></div>
                        <div th:replace="~{components/ui/badge :: status-badges(statusField='\'DONE\'')}"></div>
                        <div th:replace="~{components/ui/badge :: priority-badges(priorityField='\'HIGH\'')}"></div>
                    </div>
                </section>

                <!-- 2. Form Inputs & Interactive Controls -->
                <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 sm:p-8 space-y-6">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Form Controls & Inputs
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div th:replace="~{components/ui/input :: text(id='sample-input', label='Input Field', name='sample', placeholder='Type something...', errorExpr='sampleError')}"></div>
                        <div th:replace="~{components/ui/shadcn_components :: switch(label='Interactive Switch', checkedExpr='switchState', toggleExpr='toggleSwitch()')}"></div>
                    </div>
                    <div th:replace="~{components/ui/input :: textarea(id='sample-textarea', label='Textarea Field', name='desc', rows=3, placeholder='Write detailed description...', errorExpr='sampleError')}"></div>
                </section>

                <!-- 3. Progress, Alerts & Feedback -->
                <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 sm:p-8 space-y-6">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Progress & Alerts
                    </h2>
                    <div class="space-y-4">
                        <div th:replace="~{components/ui/shadcn_components :: progress(percentExpr='progressVal', label='Task Audit Streaming Progress')}"></div>
                        <div th:replace="~{components/ui/alert :: success(messageExpr='\'Component library loaded successfully!\'', clearClickExpr='false')}"></div>
                        <div th:replace="~{components/ui/alert :: error(messageExpr='\'Sample validation alert message\'', clearClickExpr='false')}"></div>
                    </div>
                </section>

                <!-- 4. Avatars & Accordion -->
                <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 sm:p-8 space-y-6">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Avatars & Accordion
                    </h2>
                    <div class="flex flex-wrap items-center gap-6">
                        <div th:replace="~{components/ui/shadcn_components :: avatar(name='Admin User', role='Administrator', bgClass='bg-gradient-to-tr from-indigo-600 to-purple-600')}"></div>
                        <div th:replace="~{components/ui/shadcn_components :: avatar(name='Demo Account', role='Standard User', bgClass='bg-gradient-to-tr from-emerald-600 to-teal-600')}"></div>
                    </div>
                    <div th:replace="~{components/ui/shadcn_components :: accordion(id='acc-1', title='What is PulsePoint v2?', openExpr='accordionOpen', toggleExpr='toggleAccordion()')}">
                        PulsePoint is a backend-agnostic reactive engine for the browser. The server renders plain HTML, and a single runtime adds fine-grained reactivity without JSX, Virtual DOM, or complex client build steps.
                    </div>
                </section>

                <!-- Script for Reactive Showcase State -->
                <script>
                    const [isSubmitting, setIsSubmitting] = pp.state(false);
                    const [switchState, setSwitchState] = pp.state(true);
                    const [progressVal, setProgressVal] = pp.state(65);
                    const [accordionOpen, setAccordionOpen] = pp.state(false);
                    const [sampleError, setSampleError] = pp.state('');

                    const toggleSwitch = () => {
                        setSwitchState(!switchState);
                    };

                    const toggleAccordion = () => {
                        setAccordionOpen(!accordionOpen);
                    };

                    const showAlert = () => {
                        setSampleError(sampleError ? '' : 'This is a sample error message.');
                    };
                </script>

            </div>
        </template>
    </div>

</body>
</html>
