<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Real-Time SSE Audit Progress Card Component -->
    <div th:fragment="audit-card" class="p-5 rounded-2xl bg-zinc-900/90 border border-indigo-500/40 shadow-sm" hidden="{!isAuditing}">
        <div class="flex items-center justify-between mb-2">
            <span class="inline-flex items-center gap-2 text-sm font-semibold text-indigo-300">
                <span class="animate-pulse">⚡</span> Live SSE Audit Stream &bull; Task #{auditTaskId}
            </span>
            <span class="text-xs font-mono font-bold text-indigo-400">{auditPercent}%</span>
        </div>
        <div class="w-full bg-zinc-800 rounded-full h-2 overflow-hidden mb-2">
            <div class="bg-indigo-500 h-2 rounded-full transition-all duration-300" pp-style="'width: ' + auditPercent + '%;'"></div>
        </div>
        <p class="text-xs text-zinc-400">{auditStep}</p>
    </div>

</body>
</html>
