<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Create Task Form Card Component -->
    <div th:fragment="card" class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-5 sm:p-6 shadow-sm">
        <div class="flex items-center gap-2 mb-4">
            <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <h2 class="text-base sm:text-lg font-semibold text-zinc-100">Create New Task</h2>
        </div>

        <form onsubmit="handleCreateTask(event)" class="space-y-4">
            <div th:replace="~{components/ui/input :: text(id='task-title', label='Task Title *', name='title', placeholder='e.g., Modular PulsePoint Thymeleaf Integration', errorExpr='titleError')}"></div>

            <div th:replace="~{components/ui/input :: textarea(id='task-desc', label='Description', name='description', rows=2, placeholder='Task details and acceptance criteria...', errorExpr='descError')}"></div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="task-status" class="block text-xs font-medium text-zinc-300 mb-1.5">Status</label>
                    <select id="task-status" name="status" class="w-full px-3.5 py-2 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                        <option value="TODO">TODO</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="DONE">DONE</option>
                    </select>
                </div>
                <div>
                    <label for="task-priority" class="block text-xs font-medium text-zinc-300 mb-1.5">Priority</label>
                    <select id="task-priority" name="priority" class="w-full px-3.5 py-2 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM" selected>MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                    </select>
                </div>
            </div>

            <div class="pt-1">
                <div th:replace="~{components/ui/button :: primary(text='Add Task via RPC', loadingText='Saving via RPC...', isSubmittingExpr='isSubmitting', iconPath='M12 6v6m0 0v6m0-6h6m-6 0H6')}"></div>
            </div>
        </form>
    </div>

</body>
</html>
