<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Accordion: single item -->
    <div th:fragment="item(id, title, openExpr, toggleExpr)"
         class="border border-zinc-800 bg-zinc-900/60 rounded-xl overflow-hidden transition-all duration-200">
        <button type="button"
                th:attr="onclick=${toggleExpr}"
                class="w-full px-5 py-4 text-left font-medium text-zinc-200 hover:text-white hover:bg-zinc-800/50 flex items-center justify-between transition-colors">
            <span th:text="${title}">Accordion Header</span>
            <svg class="w-5 h-5 text-zinc-400 transition-transform duration-200"
                 th:attr="class='w-5 h-5 text-zinc-400 transition-transform duration-200 ' + (${openExpr} ? 'rotate-180' : '')"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div th:attr="hidden='{!' + ${openExpr} + '}'" class="px-5 py-4 border-t border-zinc-800/80 text-sm text-zinc-400 bg-zinc-950/40">
            <slot />
        </div>
    </div>

    <!-- Accordion: group wrapper -->
    <div th:fragment="group"
         class="space-y-2">
        <slot />
    </div>

</body>
</html>
