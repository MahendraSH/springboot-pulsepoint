<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Error Alert Component -->
    <div th:fragment="error (messageExpr, clearClickExpr)"
         class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm flex items-start justify-between gap-3 shadow-sm"
         th:attr="hidden='{!' + ${messageExpr} + '}'">
        <div class="flex items-start gap-2.5">
            <svg class="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span th:text="'{' + ${messageExpr} + '}'">Error Message</span>
        </div>
        <button type="button" th:attr="onclick=${clearClickExpr}" class="text-rose-400 hover:text-rose-200">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Success Alert Component -->
    <div th:fragment="success (messageExpr, clearClickExpr)"
         class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-sm flex items-start justify-between gap-3 shadow-sm"
         th:attr="hidden='{!' + ${messageExpr} + '}'">
        <div class="flex items-start gap-2.5">
            <svg class="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span th:text="'{' + ${messageExpr} + '}'">Success Message</span>
        </div>
        <button type="button" th:attr="onclick=${clearClickExpr}" class="text-emerald-400 hover:text-emerald-200">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

</body>
</html>
