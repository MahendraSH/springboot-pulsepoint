<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Avatar: with initials -->
    <div th:fragment="default(name, role, bgClass)"
         class="inline-flex items-center gap-3">
        <div th:class="'w-10 h-10 rounded-full flex items-center justify-center font-semibold text-white shadow-sm border border-white/10 ' + ${bgClass ?: 'bg-gradient-to-tr from-indigo-600 to-purple-600'}">
            <span th:text="${name.substring(0, 1).toUpperCase()}">U</span>
        </div>
        <div th:if="${role}" class="text-left">
            <p class="text-sm font-medium text-zinc-100 leading-none mb-1" th:text="${name}">User Name</p>
            <p class="text-xs text-zinc-400 leading-none" th:text="${role}">Role</p>
        </div>
    </div>

    <!-- Avatar: small (icon-sized, no name text) -->
    <div th:fragment="small(name, bgClass)"
         th:class="'w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold text-white shadow-sm border border-white/10 ' + ${bgClass ?: 'bg-gradient-to-tr from-indigo-600 to-purple-600'}">
        <span th:text="${name.substring(0, 1).toUpperCase()}">U</span>
    </div>

    <!-- Avatar: large -->
    <div th:fragment="large(name, role, bgClass)"
         class="inline-flex items-center gap-4">
        <div th:class="'w-14 h-14 rounded-full flex items-center justify-center text-xl font-bold text-white shadow-sm border border-white/10 ' + ${bgClass ?: 'bg-gradient-to-tr from-indigo-600 to-purple-600'}">
            <span th:text="${name.substring(0, 1).toUpperCase()}">U</span>
        </div>
        <div th:if="${role}" class="text-left">
            <p class="text-base font-semibold text-white leading-none mb-1" th:text="${name}">User Name</p>
            <p class="text-sm text-zinc-400 leading-none" th:text="${role}">Role</p>
        </div>
    </div>

    <!-- Avatar: group (stacked) -->
    <div th:fragment="group"
         class="flex -space-x-2">
        <slot />
    </div>

</body>
</html>
