<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Primary Button with optional loading state -->
    <button th:fragment="primary (text, loadingText, isSubmittingExpr, iconPath)"
            type="submit"
            class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-medium shadow-sm shadow-indigo-600/30 transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed"
            disabled="{isSubmitting}">
        <span hidden="{isSubmitting}" class="inline-flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
            </svg>
            <span th:text="${text}">Submit</span>
        </span>
        <span hidden="{!isSubmitting}" class="inline-flex items-center gap-2">
            <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span th:text="${loadingText}">Saving...</span>
        </span>
    </button>

    <!-- Small Action Button (Audit, Attach, Delete etc) -->
    <button th:fragment="action (label, clickExpr, variantClass)"
            type="button"
            th:class="'inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded-md transition-colors ' + ${variantClass}"
            th:attr="onclick=${clickExpr}">
        <span th:text="${label}">Action</span>
    </button>

</body>
</html>
