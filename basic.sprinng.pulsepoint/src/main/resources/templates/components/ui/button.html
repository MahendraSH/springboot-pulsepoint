<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- ========================================================================= -->
    <!-- Primary / Default Button                                                  -->
    <!-- Variables: text, loadingText, isSubmittingExpr, iconPath, clickExpr,      -->
    <!--            type, size, classNames                                         -->
    <!-- ========================================================================= -->
    <th:block th:fragment="primary">
        <!-- Variant with reactive submission state -->
        <button th:if="${isSubmittingExpr != null and isSubmittingExpr != '' and isSubmittingExpr != 'false'}"
                th:attr="type=${type != null ? type : (clickExpr != null and clickExpr != '' and clickExpr != 'false' ? 'button' : 'submit')},
                         onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
                th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white shadow-sm shadow-indigo-600/30 ' + 
                           (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                            (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 
                             (size == 'icon' ? 'h-9 w-9 p-0 rounded-lg ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg '))) + 
                           (classNames != null ? classNames : '')}"
                disabled="{isSubmitting}">
            <span hidden="{isSubmitting}" class="inline-flex items-center gap-2">
                <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
                </svg>
                <span th:text="${text != null ? text : 'Submit'}">Submit</span>
            </span>
            <span hidden="{!isSubmitting}" class="inline-flex items-center gap-2">
                <svg class="animate-spin w-4 h-4 shrink-0 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span th:text="${loadingText != null ? loadingText : 'Loading...'}">Loading...</span>
            </span>
        </button>

        <!-- Standard static or click-driven primary button -->
        <button th:unless="${isSubmittingExpr != null and isSubmittingExpr != '' and isSubmittingExpr != 'false'}"
                th:attr="type=${type != null ? type : (clickExpr != null and clickExpr != '' and clickExpr != 'false' ? 'button' : 'submit')},
                         onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
                th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white shadow-sm shadow-indigo-600/30 ' + 
                           (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                            (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 
                             (size == 'icon' ? 'h-9 w-9 p-0 rounded-lg ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg '))) + 
                           (classNames != null ? classNames : '')}">
            <span class="inline-flex items-center gap-2">
                <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
                </svg>
                <span th:text="${text != null ? text : 'Submit'}">Submit</span>
            </span>
        </button>
    </th:block>

    <!-- ========================================================================= -->
    <!-- Secondary Button                                                          -->
    <!-- Variables: text, clickExpr, iconPath, size, type, classNames              -->
    <!-- ========================================================================= -->
    <button th:fragment="secondary"
            th:attr="type=${type != null ? type : 'button'},
                     onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
            th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500/50 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-850 text-zinc-100 border border-zinc-700/60 shadow-sm ' + 
                       (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                        (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg ')) + 
                       (classNames != null ? classNames : '')}">
        <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
        </svg>
        <span th:text="${text != null ? text : 'Secondary'}">Secondary</span>
    </button>

    <!-- ========================================================================= -->
    <!-- Destructive Button                                                        -->
    <!-- Variables: text, clickExpr, iconPath, size, type, classNames              -->
    <!-- ========================================================================= -->
    <button th:fragment="destructive"
            th:attr="type=${type != null ? type : 'button'},
                     onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
            th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500/50 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white shadow-sm shadow-rose-600/30 ' + 
                       (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                        (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg ')) + 
                       (classNames != null ? classNames : '')}">
        <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
        </svg>
        <span th:text="${text != null ? text : 'Delete'}">Delete</span>
    </button>

    <!-- ========================================================================= -->
    <!-- Outline Button                                                            -->
    <!-- Variables: text, clickExpr, iconPath, size, type, classNames              -->
    <!-- ========================================================================= -->
    <button th:fragment="outline"
            th:attr="type=${type != null ? type : 'button'},
                     onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
            th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500/50 border border-zinc-700/80 bg-transparent hover:bg-zinc-800/80 active:bg-zinc-800 text-zinc-200 hover:text-white ' + 
                       (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                        (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg ')) + 
                       (classNames != null ? classNames : '')}">
        <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
        </svg>
        <span th:text="${text != null ? text : 'Outline'}">Outline</span>
    </button>

    <!-- ========================================================================= -->
    <!-- Ghost Button                                                              -->
    <!-- Variables: text, clickExpr, iconPath, size, type, classNames              -->
    <!-- ========================================================================= -->
    <button th:fragment="ghost"
            th:attr="type=${type != null ? type : 'button'},
                     onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
            th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-500/50 bg-transparent hover:bg-zinc-800/80 active:bg-zinc-800 text-zinc-300 hover:text-white ' + 
                       (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                        (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg ')) + 
                       (classNames != null ? classNames : '')}">
        <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
        </svg>
        <span th:text="${text != null ? text : 'Ghost'}">Ghost</span>
    </button>

    <!-- ========================================================================= -->
    <!-- Link Button                                                               -->
    <!-- Variables: text, clickExpr, iconPath, type, classNames                    -->
    <!-- ========================================================================= -->
    <button th:fragment="link"
            th:attr="type=${type != null ? type : 'button'},
                     onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
            th:class="${'inline-flex items-center gap-1.5 font-medium text-sm text-indigo-400 hover:text-indigo-300 underline-offset-4 hover:underline transition duration-150 cursor-pointer disabled:opacity-50 select-none p-0 bg-transparent border-0 ' + 
                       (classNames != null ? classNames : '')}">
        <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
        </svg>
        <span th:text="${text != null ? text : 'Link Button'}">Link Button</span>
    </button>

    <!-- ========================================================================= -->
    <!-- Icon-Only Button                                                          -->
    <!-- Variables: iconPath, clickExpr, title, variantClass, size, type           -->
    <!-- ========================================================================= -->
    <button th:fragment="icon"
            th:attr="type=${type != null ? type : 'button'},
                     title=${title},
                     onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
            th:class="${'inline-flex items-center justify-center transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none rounded-lg ' + 
                       (size == 'sm' ? 'h-7 w-7 ' : (size == 'lg' ? 'h-11 w-11 ' : 'h-9 w-9 ')) + 
                       (variantClass != null ? variantClass : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white border border-zinc-700/60')}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
        </svg>
    </button>

    <!-- ========================================================================= -->
    <!-- Backward-compatible Action Button (Audit, Attach, Delete, etc.)           -->
    <!-- Variables: label, clickExpr, variantClass                                 -->
    <!-- ========================================================================= -->
    <button th:fragment="action"
            type="button"
            th:class="${'inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-md transition-colors cursor-pointer ' + (variantClass != null ? variantClass : '')}"
            th:attr="onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}">
        <span th:text="${label}">Action</span>
    </button>

    <!-- ========================================================================= -->
    <!-- Universal Button (btn)                                                    -->
    <!-- Variables: text, variant, size, clickExpr, isSubmittingExpr, loadingText, -->
    <!--            iconPath, type, classNames                                     -->
    <!-- ========================================================================= -->
    <th:block th:fragment="btn">
        <button th:if="${isSubmittingExpr != null and isSubmittingExpr != '' and isSubmittingExpr != 'false'}"
                th:attr="type=${type != null ? type : (clickExpr != null and clickExpr != '' and clickExpr != 'false' ? 'button' : 'submit')},
                         onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
                th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 ' + 
                           (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                            (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 
                             (size == 'icon' ? 'h-9 w-9 p-0 rounded-lg ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg '))) + 
                           (variant == 'secondary' ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700/60 ' : 
                            (variant == 'destructive' ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-sm shadow-rose-600/30 ' : 
                             (variant == 'outline' ? 'border border-zinc-700/80 bg-transparent hover:bg-zinc-800/80 text-zinc-200 hover:text-white ' : 
                              (variant == 'ghost' ? 'bg-transparent hover:bg-zinc-800/80 text-zinc-300 hover:text-white ' : 
                               (variant == 'link' ? 'text-indigo-400 hover:text-indigo-300 underline-offset-4 hover:underline p-0 h-auto bg-transparent border-0 ' : 
                                'bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm shadow-indigo-600/30 '))))) + 
                           (classNames != null ? classNames : '')}"
                disabled="{isSubmitting}">

            <span hidden="{isSubmitting}" class="inline-flex items-center gap-2">
                <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
                </svg>
                <span th:text="${text != null ? text : 'Button'}">Button</span>
            </span>

            <span hidden="{!isSubmitting}" class="inline-flex items-center gap-2">
                <svg class="animate-spin w-4 h-4 shrink-0 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span th:text="${loadingText != null ? loadingText : 'Loading...'}">Loading...</span>
            </span>
        </button>

        <button th:unless="${isSubmittingExpr != null and isSubmittingExpr != '' and isSubmittingExpr != 'false'}"
                th:attr="type=${type != null ? type : (clickExpr != null and clickExpr != '' and clickExpr != 'false' ? 'button' : 'submit')},
                         onclick=${(clickExpr != null and clickExpr != '' and clickExpr != 'false') ? clickExpr : null}"
                th:class="${'inline-flex items-center justify-center font-medium transition duration-150 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none focus-visible:ring-2 ' + 
                           (size == 'sm' ? 'h-8 px-3 text-xs gap-1.5 rounded-lg ' : 
                            (size == 'lg' ? 'h-11 px-6 text-base gap-2.5 rounded-xl ' : 
                             (size == 'icon' ? 'h-9 w-9 p-0 rounded-lg ' : 'h-9 px-4 py-2 text-sm gap-2 rounded-lg '))) + 
                           (variant == 'secondary' ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700/60 ' : 
                            (variant == 'destructive' ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-sm shadow-rose-600/30 ' : 
                             (variant == 'outline' ? 'border border-zinc-700/80 bg-transparent hover:bg-zinc-800/80 text-zinc-200 hover:text-white ' : 
                              (variant == 'ghost' ? 'bg-transparent hover:bg-zinc-800/80 text-zinc-300 hover:text-white ' : 
                               (variant == 'link' ? 'text-indigo-400 hover:text-indigo-300 underline-offset-4 hover:underline p-0 h-auto bg-transparent border-0 ' : 
                                'bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm shadow-indigo-600/30 '))))) + 
                           (classNames != null ? classNames : '')}">
            <span class="inline-flex items-center gap-2">
                <svg th:if="${iconPath != null and iconPath != ''}" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" th:attr="d=${iconPath}"></path>
                </svg>
                <span th:text="${text != null ? text : 'Button'}">Button</span>
            </span>
        </button>
    </th:block>

</body>
</html>
