<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Card: default container -->
    <div th:fragment="default(title, description)"
         class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl overflow-hidden">
        <div th:if="${title}" class="px-6 pt-6 pb-2">
            <h3 class="text-lg font-semibold text-white tracking-tight" th:text="${title}">Card Title</h3>
            <p th:if="${description}" class="text-sm text-zinc-400 mt-1" th:text="${description}">Card description</p>
        </div>
        <div class="px-6 py-4">
            <slot />
        </div>
    </div>

    <!-- Card: with header, body, footer sections -->
    <div th:fragment="full(title, description, footerAlign)"
         class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl overflow-hidden">
        <div class="px-6 pt-6 pb-4 border-b border-zinc-800/60">
            <h3 class="text-lg font-semibold text-white tracking-tight" th:text="${title}">Card Title</h3>
            <p th:if="${description}" class="text-sm text-zinc-400 mt-1" th:text="${description}">Description</p>
        </div>
        <div class="px-6 py-5">
            <slot />
        </div>
        <div th:classappend="${footerAlign == 'right'} ? 'justify-end' : (${footerAlign == 'center'} ? 'justify-center' : 'justify-start')"
             class="px-6 py-4 border-t border-zinc-800/60 bg-zinc-950/30 flex items-center gap-3">
        </div>
    </div>

    <!-- Card: compact variant -->
    <div th:fragment="compact(title)"
         class="bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-4">
        <h4 th:if="${title}" class="text-sm font-medium text-white mb-2" th:text="${title}">Title</h4>
        <slot />
    </div>

    <!-- Card: interactive (hover effect) -->
    <div th:fragment="interactive(title, description, clickExpr)"
         class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 transition-all duration-200 hover:border-zinc-700/80 hover:bg-zinc-900/80 cursor-pointer"
         th:attr="onclick=${clickExpr}">
        <h3 th:if="${title}" class="text-lg font-semibold text-white tracking-tight" th:text="${title}">Title</h3>
        <p th:if="${description}" class="text-sm text-zinc-400 mt-1" th:text="${description}">Description</p>
        <div class="mt-3">
            <slot />
        </div>
    </div>

</body>
</html>
