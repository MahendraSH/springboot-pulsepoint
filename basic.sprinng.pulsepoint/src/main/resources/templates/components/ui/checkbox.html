<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Checkbox: default -->
    <div th:fragment="default(id, name, label, checkedExpr, changeExpr, description)"
         class="flex items-start gap-3">
        <input th:id="${id}" th:name="${name}" type="checkbox"
               class="mt-0.5 w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-indigo-500 focus:ring-2 focus:ring-indigo-500/40 focus:ring-offset-0 cursor-pointer accent-indigo-500"
               th:attr="checked=${checkedExpr != null} ? '{' + ${checkedExpr} + '}' : null,
                        onchange=${changeExpr}" />
        <div class="flex flex-col gap-0.5">
            <label th:for="${id}" class="text-sm font-medium text-zinc-200 cursor-pointer" th:text="${label}">Label</label>
            <span th:if="${description}" class="text-xs text-zinc-500" th:text="${description}">Helper text</span>
        </div>
    </div>

    <!-- Checkbox: simple (label only, no description) -->
    <div th:fragment="simple(id, name, label, checkedExpr, changeExpr)"
         class="flex items-center gap-2">
        <input th:id="${id}" th:name="${name}" type="checkbox"
               class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-indigo-500 focus:ring-2 focus:ring-indigo-500/40 focus:ring-offset-0 cursor-pointer accent-indigo-500"
               th:attr="checked=${checkedExpr != null} ? '{' + ${checkedExpr} + '}' : null,
                        onchange=${changeExpr}" />
        <label th:for="${id}" class="text-sm text-zinc-300 cursor-pointer" th:text="${label}">Label</label>
    </div>

</body>
</html>
