<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Text Input Field -->
    <div th:fragment="text (id, label, name, placeholder, errorExpr)">
        <label th:for="${id}" class="block text-xs font-medium text-zinc-300 mb-1.5" th:text="${label}">Label</label>
        <input th:id="${id}" th:name="${name}"
               class="w-full px-3.5 py-2 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all"
               th:placeholder="${placeholder}" />
        <small class="text-xs text-rose-400 mt-1 block" th:attr="hidden='{!' + ${errorExpr} + '}'" th:text="'{' + ${errorExpr} + '}'"></small>
    </div>

    <!-- Textarea Input Field -->
    <div th:fragment="textarea (id, label, name, rows, placeholder, errorExpr)">
        <label th:for="${id}" class="block text-xs font-medium text-zinc-300 mb-1.5" th:text="${label}">Label</label>
        <textarea th:id="${id}" th:name="${name}" th:rows="${rows}"
                  class="w-full px-3.5 py-2 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all"
                  th:placeholder="${placeholder}"></textarea>
        <small class="text-xs text-rose-400 mt-1 block" th:attr="hidden='{!' + ${errorExpr} + '}'" th:text="'{' + ${errorExpr} + '}'"></small>
    </div>

</body>
</html>
