<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Kbd: keyboard shortcut display -->
    <kbd th:fragment="default(text)"
         class="inline-flex items-center justify-center px-2 py-0.5 rounded-md bg-zinc-800 border border-zinc-700/60 text-xs font-mono text-zinc-300 shadow-sm min-w-[1.5rem] text-center"
         th:text="${text}">⌘</kbd>

    <!-- Kbd: combo (e.g. Ctrl+K) -->
    <span th:fragment="combo(keys)"
          class="inline-flex items-center gap-1">
        <th:block th:each="key, stat : ${keys}">
            <kbd class="inline-flex items-center justify-center px-2 py-0.5 rounded-md bg-zinc-800 border border-zinc-700/60 text-xs font-mono text-zinc-300 shadow-sm min-w-[1.5rem] text-center"
                 th:text="${key}">K</kbd>
            <span th:if="${!stat.last}" class="text-xs text-zinc-500">+</span>
        </th:block>
    </span>

</body>
</html>
