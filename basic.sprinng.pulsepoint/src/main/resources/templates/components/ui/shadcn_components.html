<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Accordion Component -->
    <div th:fragment="accordion (id, title, openExpr, toggleExpr)"
         class="border border-zinc-800 bg-zinc-900/60 rounded-xl overflow-hidden transition-all duration-200">
        <button type="button"
                th:attr="onclick=${toggleExpr}"
                class="w-full px-5 py-4 text-left font-medium text-zinc-200 hover:text-white hover:bg-zinc-800/50 flex items-center justify-between transition-colors">
            <span th:text="${title}">Accordion Header</span>
            <svg class="w-5 h-5 text-zinc-400 transition-transform duration-200"
                 th:attr="class='w-5 h-5 text-zinc-400 transition-transform duration-200 ' + (${openExpr} ? 'rotate-180' : '')"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div th:attr="hidden='{!' + ${openExpr} + '}'" class="px-5 py-4 border-t border-zinc-800/80 text-sm text-zinc-400 bg-zinc-950/40">
            <slot />
        </div>
    </div>

    <!-- Avatar Component -->
    <div th:fragment="avatar (name, role, bgClass)"
         class="inline-flex items-center gap-3">
        <div th:class="'w-10 h-10 rounded-full flex items-center justify-center font-semibold text-white shadow-sm border border-white/10 ' + ${bgClass}">
            <span th:text="${name.substring(0, 1).toUpperCase()}">U</span>
        </div>
        <div class="text-left">
            <p class="text-sm font-medium text-zinc-100 leading-none mb-1" th:text="${name}">User Name</p>
            <p class="text-xs text-zinc-400 leading-none" th:text="${role}">Role</p>
        </div>
    </div>

    <!-- Switch / Toggle Component -->
    <div th:fragment="switch (label, checkedExpr, toggleExpr)"
         class="inline-flex items-center gap-3 cursor-pointer select-none"
         th:attr="onclick=${toggleExpr}">
        <div th:class="'w-11 h-6 rounded-full transition-colors relative p-0.5 border border-zinc-700/50 ' + (${checkedExpr} ? 'bg-indigo-600' : 'bg-zinc-800')">
            <div th:class="'w-5 h-5 rounded-full bg-white shadow-md transform transition-transform duration-200 ' + (${checkedExpr} ? 'translate-x-5' : 'translate-x-0')"></div>
        </div>
        <span class="text-sm font-medium text-zinc-300" th:text="${label}">Toggle Switch</span>
    </div>

    <!-- Progress Bar Component -->
    <div th:fragment="progress (percentExpr, label)" class="w-full">
        <div class="flex justify-between items-center mb-1.5 text-xs font-medium text-zinc-400">
            <span th:text="${label}">Progress</span>
            <span th:text="'{' + ${percentExpr} + '} + \'%\'">0%</span>
        </div>
        <div class="w-full bg-zinc-800 rounded-full h-2 overflow-hidden border border-zinc-700/40">
            <div class="bg-indigo-500 h-full rounded-full transition-all duration-300 shadow-sm shadow-indigo-500/50"
                 th:attr="pp-style='width: {' + ${percentExpr} + '}%'"></div>
        </div>
    </div>

    <!-- Tooltip Component -->
    <div th:fragment="tooltip (text)"
         class="group relative inline-block">
        <slot />
        <div class="pointer-events-none absolute -top-9 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity bg-zinc-800 text-zinc-100 text-xs py-1 px-2.5 rounded-md shadow-lg whitespace-nowrap border border-zinc-700 z-50">
            <span th:text="${text}">Tooltip text</span>
            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-zinc-800 border-r border-b border-zinc-700 rotate-45"></div>
        </div>
    </div>

    <!-- Tabs Component -->
    <div th:fragment="tabs (tabList, activeTabExpr, changeTabExpr)" class="border-b border-zinc-800 flex gap-6">
        <button type="button" th:each="tab : ${tabList}"
                th:attr="onclick=${changeTabExpr} + '(\'' + ${tab} + '\')'"
                th:class="'pb-3 text-sm font-medium border-b-2 transition-all ' + (${activeTabExpr} == ${tab} ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-zinc-400 hover:text-zinc-200')"
                th:text="${tab}">
            Tab
        </button>
    </div>

    <!-- Skeleton Loading Component -->
    <div th:fragment="skeleton (heightClass, widthClass)"
         th:class="'animate-pulse bg-zinc-800/80 rounded-lg ' + ${heightClass} + ' ' + ${widthClass}">
    </div>

</body>
</html>
