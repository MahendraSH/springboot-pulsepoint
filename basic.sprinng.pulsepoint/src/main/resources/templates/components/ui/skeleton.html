<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Skeleton: line -->
    <div th:fragment="line(widthClass)"
         th:class="'animate-pulse bg-zinc-800/80 rounded-lg h-4 ' + ${widthClass ?: 'w-full'}">
    </div>

    <!-- Skeleton: block -->
    <div th:fragment="block(heightClass, widthClass)"
         th:class="'animate-pulse bg-zinc-800/80 rounded-lg ' + ${heightClass ?: 'h-24'} + ' ' + ${widthClass ?: 'w-full'}">
    </div>

    <!-- Skeleton: circle (avatar placeholder) -->
    <div th:fragment="circle(size)"
         th:class="'animate-pulse bg-zinc-800/80 rounded-full ' + (${size == 'sm'} ? 'w-8 h-8' : (${size == 'lg'} ? 'w-14 h-14' : 'w-10 h-10'))">
    </div>

    <!-- Skeleton: card (full card placeholder) -->
    <div th:fragment="card"
         class="animate-pulse bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 space-y-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-zinc-800/80"></div>
            <div class="space-y-2 flex-1">
                <div class="h-4 bg-zinc-800/80 rounded-lg w-1/3"></div>
                <div class="h-3 bg-zinc-800/80 rounded-lg w-1/4"></div>
            </div>
        </div>
        <div class="space-y-2">
            <div class="h-3 bg-zinc-800/80 rounded-lg w-full"></div>
            <div class="h-3 bg-zinc-800/80 rounded-lg w-5/6"></div>
            <div class="h-3 bg-zinc-800/80 rounded-lg w-2/3"></div>
        </div>
    </div>

    <!-- Skeleton: table row -->
    <tr th:fragment="tableRow(cols)"
        class="animate-pulse">
        <td th:each="i : ${#numbers.sequence(1, cols ?: 4)}" class="px-4 py-3">
            <div class="h-4 bg-zinc-800/80 rounded-lg"></div>
        </td>
    </tr>

</body>
</html>
