<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Slider: default range slider -->
    <!-- Variables: id, name, label, min, max, step, valueExpr, changeExpr -->
    <div th:fragment="default" class="w-full space-y-2">
        <div class="flex items-center justify-between text-xs font-medium text-zinc-300">
            <label th:if="${label}" th:for="${id}" th:text="${label}">Volume</label>
            <span th:if="${valueExpr != null}"
                  class="px-2 py-0.5 rounded-md font-mono text-xs bg-zinc-800 text-indigo-400 border border-zinc-700/60"
                  th:text="'{' + ${valueExpr} + '}'">50</span>
        </div>
        <input type="range"
               th:id="${id}"
               th:name="${name}"
               th:attr="min=${min != null ? min : 0},
                        max=${max != null ? max : 100},
                        step=${step != null ? step : 1},
                        value=${(valueExpr != null and valueExpr != '' and valueExpr != 'false') ? ('{' + valueExpr + '}') : null},
                        oninput=${(changeExpr != null and changeExpr != '' and changeExpr != 'false') ? changeExpr : null}"
               class="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
    </div>

</body>
</html>
