<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Table: default data table -->
    <div th:fragment="default(columns)" class="overflow-x-auto rounded-xl border border-zinc-800/80">
        <table class="w-full text-sm">
            <thead class="bg-zinc-900/80">
                <tr>
                    <th th:each="col : ${columns}"
                        class="px-4 py-3 text-left text-xs font-medium text-zinc-400 uppercase tracking-wider"
                        th:text="${col}">Column</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-zinc-800/60">
                <slot />
            </tbody>
        </table>
    </div>

    <!-- Table: row -->
    <tr th:fragment="row(clickExpr)"
        class="hover:bg-zinc-800/40 transition-colors"
        th:attr="onclick=${clickExpr}">
        <slot />
    </tr>

    <!-- Table: cell -->
    <td th:fragment="cell(text, align)"
        th:classappend="${align == 'right'} ? 'text-right' : (${align == 'center'} ? 'text-center' : 'text-left')"
        class="px-4 py-3 text-zinc-300"
        th:text="${text}">Cell</td>

    <!-- Table: compact (smaller padding) -->
    <div th:fragment="compact(columns)" class="overflow-x-auto rounded-lg border border-zinc-800/80">
        <table class="w-full text-xs">
            <thead class="bg-zinc-900/80">
                <tr>
                    <th th:each="col : ${columns}"
                        class="px-3 py-2 text-left text-xs font-medium text-zinc-500 uppercase tracking-wider"
                        th:text="${col}">Column</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-zinc-800/60">
                <slot />
            </tbody>
        </table>
    </div>

    <!-- Table: empty state -->
    <tr th:fragment="empty(message, colSpan)">
        <td th:colspan="${colSpan}" class="px-6 py-12 text-center">
            <div class="flex flex-col items-center gap-2">
                <svg class="w-8 h-8 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
                <p class="text-sm text-zinc-500" th:text="${message ?: 'No data available'}">No data available</p>
            </div>
        </td>
    </tr>

</body>
</html>
