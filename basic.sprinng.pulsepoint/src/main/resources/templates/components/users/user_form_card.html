<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Create User Form Card Component -->
    <div th:fragment="card" class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-5 sm:p-6 shadow-sm mb-6">
        <div class="flex items-center gap-2 mb-4">
            <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
            </svg>
            <h2 class="text-base sm:text-lg font-semibold text-zinc-100">Add New User</h2>
        </div>

        <form onsubmit="handleCreateUser(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div th:replace="~{components/ui/input :: text(id='user-username', label='Username *', name='username', placeholder='e.g., john_doe', errorExpr='usernameError')}"></div>
                <div th:replace="~{components/ui/input :: text(id='user-email', label='Email *', name='email', placeholder='e.g., john@example.com', errorExpr='emailError')}"></div>
            </div>

            <div>
                <label for="user-role" class="block text-xs font-medium text-zinc-300 mb-1.5">Role *</label>
                <select id="user-role" name="role" class="w-full px-3.5 py-2 bg-zinc-950/80 border border-zinc-800 rounded-lg text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all">
                    <option value="ROLE_USER">User (ROLE_USER)</option>
                    <option value="ROLE_ADMIN">Admin (ROLE_ADMIN)</option>
                </select>
            </div>

            <div class="pt-1">
                <div th:replace="~{components/ui/button :: primary(text='Create User via RPC', loadingText='Saving User...', isSubmittingExpr='isSubmitting', iconPath='M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z')}"></div>
            </div>
        </form>
    </div>

</body>
</html>
