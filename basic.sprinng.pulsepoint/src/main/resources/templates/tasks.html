<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager — Spring Boot + PulsePoint Modular Components</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <!-- PulsePoint v2 Runtime -->
    <script type="module">
        import { ComponentInit as PP } from "/js/pp-reactive-v2.min.js";
        PP.bootstrap();
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

        <!-- Header Component -->
        <header th:replace="~{components/tasks/task_header :: header}"></header>

        <!-- PulsePoint Reactive Component Boundary -->
        <template pp-component="task_manager">
            <div pp-component="task_manager" class="space-y-6">

                <!-- Live Sync & Quick Status Bar Component -->
                <div th:replace="~{components/tasks/task_stats_bar :: bar}"></div>

                <!-- Notifications Components -->
                <div th:replace="~{components/ui/alert :: error(messageExpr='errorMessage', clearClickExpr='setErrorMessage(\'\')')}"></div>
                <div th:replace="~{components/ui/alert :: success(messageExpr='successMessage', clearClickExpr='setSuccessMessage(\'\')')}"></div>

                <!-- Create Task Card Component -->
                <div th:replace="~{components/tasks/task_form_card :: card}"></div>

                <!-- SSE Audit Progress Card Component -->
                <div th:replace="~{components/tasks/task_audit_card :: audit-card}"></div>

                <!-- Multipart Upload Progress Card Component -->
                <div th:replace="~{components/tasks/task_upload_card :: upload-card}"></div>

                <input type="file" id="task-file-input" class="hidden" onchange="handleFileUpload(event)" />

                <!-- Task List Section Component -->
                <section th:replace="~{components/tasks/task_list_section :: list-section}"></section>

                <!-- PulsePoint Component Script -->
                <script>
                    const [tasks, setTasks] = pp.state([]);
                    const [filter, setFilter] = pp.state('ALL');
                    const [isLoading, setIsLoading] = pp.state(true);
                    const [isSubmitting, setIsSubmitting] = pp.state(false);
                    const [errorMessage, setErrorMessage] = pp.state('');
                    const [successMessage, setSuccessMessage] = pp.state('');
                    const [titleError, setTitleError] = pp.state('');
                    const [descError, setDescError] = pp.state('');

                    // Multipart Upload state
                    const [uploadTaskId, setUploadTaskId] = pp.state(null);
                    const [uploadProgress, setUploadProgress] = pp.state(0);
                    const [isUploading, setIsUploading] = pp.state(false);

                    // SSE Streaming state
                    const [auditTaskId, setAuditTaskId] = pp.state(null);
                    const [auditPercent, setAuditPercent] = pp.state(0);
                    const [auditStep, setAuditStep] = pp.state('');
                    const [isAuditing, setIsAuditing] = pp.state(false);

                    // WebSocket Live Sync state
                    const [liveSyncStatus, setLiveSyncStatus] = pp.state('Connecting...');

                    // Dynamic Metrics
                    const todoCount = tasks.filter(t => t.status === 'TODO').length;
                    const inProgressCount = tasks.filter(t => t.status === 'IN_PROGRESS').length;
                    const doneCount = tasks.filter(t => t.status === 'DONE').length;

                    // Socket handle ref for clean lifecycle management per PulsePoint v2 spec
                    const socketRef = pp.ref(null);

                    // Initialize Named WebSocket for live multi-tab collaborative sync
                    pp.effect(() => {
                        try {
                            socketRef.current = pp.socket("tasks", {}, {
                                onOpen: ({ reconnected }) => {
                                    setLiveSyncStatus("Connected");
                                    if (reconnected) {
                                        loadTasks();
                                    }
                                },
                                onMessage: (msg) => {
                                    if (!msg || typeof msg !== "object") return;
                                    if (msg.event === "TASK_CREATED" && msg.task) {
                                        setTasks(prev => prev.some(t => t.id === msg.task.id) ? prev : [msg.task, ...prev]);
                                        setSuccessMessage('⚡ Live Sync: Task #' + msg.task.id + ' created in another session');
                                    } else if (msg.event === "TASK_UPDATED" && msg.task) {
                                        setTasks(prev => prev.map(t => t.id === msg.task.id ? msg.task : t));
                                        setSuccessMessage('⚡ Live Sync: Task #' + msg.task.id + ' updated in another session');
                                    } else if (msg.event === "TASK_DELETED" && msg.id) {
                                        setTasks(prev => prev.filter(t => t.id !== msg.id));
                                        setSuccessMessage('⚡ Live Sync: Task #' + msg.id + ' deleted in another session');
                                    }
                                },
                                onReconnecting: ({ attempt }) => {
                                    setLiveSyncStatus("Reconnecting (" + attempt + ")...");
                                },
                                onClose: ({ willReconnect }) => {
                                    setLiveSyncStatus(willReconnect ? "Reconnecting..." : "Disconnected");
                                }
                            });
                        } catch (err) {
                            console.warn("WebSocket connection error:", err);
                            setLiveSyncStatus("Disconnected");
                        }

                        return () => {
                            if (socketRef.current) {
                                socketRef.current.close();
                                socketRef.current = null;
                            }
                        };
                    }, []);

                    // Load initial tasks on mount via PulsePoint RPC
                    pp.effect(() => {
                        loadTasks();
                    }, []);

                    const loadTasks = async () => {
                        setIsLoading(true);
                        setErrorMessage('');
                        try {
                            const result = await pp.rpc("listTasks");
                            setTasks(result || []);
                        } catch (err) {
                            setErrorMessage(err.message || 'Failed to load tasks via RPC');
                        } finally {
                            setIsLoading(false);
                        }
                    };

                    const handleCreateTask = async (event) => {
                        event.preventDefault();
                        const form = event.currentTarget;
                        setIsSubmitting(true);
                        setErrorMessage('');
                        setSuccessMessage('');
                        setTitleError('');
                        setDescError('');

                        try {
                            const formData = new FormData(form);
                            const payload = Object.fromEntries(formData.entries());

                            const created = await pp.rpc("createTask", payload);
                            setTasks([created, ...tasks]);
                            setSuccessMessage('Task created successfully via PulsePoint RPC!');
                            form.reset();
                        } catch (err) {
                            if (err.errors) {
                                if (err.errors.title) setTitleError(err.errors.title.join(', '));
                                if (err.errors.description) setDescError(err.errors.description.join(', '));
                                const details = Object.values(err.errors).flat().join(', ');
                                setErrorMessage('Validation error: ' + details);
                            } else {
                                setErrorMessage(err.message || 'Failed to create task via RPC');
                            }
                        } finally {
                            setIsSubmitting(false);
                        }
                    };

                    const changeStatus = async (id, newStatus) => {
                        setErrorMessage('');
                        try {
                            const updated = await pp.rpc("updateTask", { id: id, status: newStatus });
                            setTasks(tasks.map(t => t.id === id ? updated : t));
                            setSuccessMessage('Task #' + id + ' status updated to ' + newStatus);
                        } catch (err) {
                            setErrorMessage(err.message || 'Failed to update task status');
                        }
                    };

                    const handleDeleteTask = async (id) => {
                        if (!confirm('Are you sure you want to delete task #' + id + '?')) {
                            return;
                        }
                        setErrorMessage('');
                        try {
                            await pp.rpc("deleteTask", { id: id });
                            setTasks(tasks.filter(t => t.id !== id));
                            setSuccessMessage('Task #' + id + ' deleted successfully.');
                        } catch (err) {
                            setErrorMessage(err.message || 'Failed to delete task');
                        }
                    };

                    const handleStreamAudit = async (taskId) => {
                        setAuditTaskId(taskId);
                        setAuditPercent(0);
                        setAuditStep('Initiating SSE audit stream for task #' + taskId + '...');
                        setIsAuditing(true);
                        setErrorMessage('');
                        try {
                            await pp.rpc("streamTaskAudit", { taskId: taskId }, {
                                onStream: (chunk) => {
                                    if (chunk && typeof chunk === "object") {
                                        if (chunk.percent !== undefined) setAuditPercent(chunk.percent);
                                        if (chunk.step) setAuditStep(chunk.step);
                                    }
                                },
                                onStreamComplete: () => {
                                    setAuditPercent(100);
                                    setAuditStep('Audit stream completed successfully. Task is healthy!');
                                    setTimeout(() => {
                                        setIsAuditing(false);
                                    }, 3500);
                                },
                                onStreamError: (err) => {
                                    setAuditStep('Stream error: ' + (err.message || 'Stream interrupted'));
                                }
                            });
                        } catch (err) {
                            setAuditStep('Failed to stream audit: ' + (err.message || 'Error'));
                        }
                    };

                    const promptUpload = (taskId) => {
                        setUploadTaskId(taskId);
                        const input = document.getElementById('task-file-input');
                        if (input) input.click();
                    };

                    const handleFileUpload = async (event) => {
                        const file = event.target.files[0];
                        if (!file || !uploadTaskId) return;
                        setIsUploading(true);
                        setUploadProgress(0);
                        setErrorMessage('');
                        try {
                            await pp.rpc("uploadTaskAttachment", {
                                taskId: uploadTaskId,
                                file: file,
                                note: 'Attached via PulsePoint RPC'
                            }, {
                                onUploadProgress: ({ loaded, total, percent }) => {
                                    if (percent !== null) setUploadProgress(Math.round(percent));
                                },
                                onUploadComplete: () => {
                                    setUploadProgress(100);
                                    setSuccessMessage('File "' + file.name + '" uploaded successfully to Task #' + uploadTaskId);
                                    setTimeout(() => {
                                        setIsUploading(false);
                                    }, 2500);
                                }
                            });
                        } catch (err) {
                            setErrorMessage('Upload failed: ' + (err.message || 'Error'));
                            setIsUploading(false);
                        }
                        event.target.value = '';
                    };

                    // Computed filtered task list
                    const filteredTasks = tasks.filter(t => {
                        if (filter === 'ALL') return true;
                        return t.status === filter;
                    });
                </script>
            </div>
        </template>
    </div>
</body>
</html>
